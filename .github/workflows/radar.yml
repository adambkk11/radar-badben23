name: Radar de licitaciones

on:
  schedule:
    - cron: "17 5-21/3 * * *"   # cada 3 horas de 07:17 a 23:17 (hora de España en verano)
  workflow_dispatch:
    inputs:
      orden:
        description: "Qué hacer"
        type: choice
        default: todo
        options: [todo, actualizar, analizar, web, avisar, historico]
      meses:
        description: "Solo para 'historico': meses hacia atrás"
        default: "12"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # La base de datos (cifrada) se guarda en la caché de Actions, no en el repositorio
      - name: Recuperar base de datos
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db.enc
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Comprobar contraseña
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::Falta el secreto SITE_PASSWORD (sin él los datos serían públicos)."; exit 1
          fi

      - name: Ejecutar radar
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          CONFIG_PRIVADA: ${{ secrets.CONFIG_PRIVADA }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RADAR_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          ORDEN="${{ github.event.inputs.orden || 'todo' }}"
          if [ "$ORDEN" = "historico" ]; then
            python run.py historico "${{ github.event.inputs.meses || '12' }}"
          else
            python run.py "$ORDEN"
          fi
          # asegura que la web siempre tiene datos
          [ -f site/data.enc ] || python run.py web

      - name: Guardar base de datos (cifrada)
        uses: actions/cache/save@v4
        with:
          path: data/radar.db.enc
          key: radar-db-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
