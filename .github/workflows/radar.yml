name: Radar de licitaciones

on:
  schedule:
    - cron: "17 5-21 * * *"   # cada hora de 07:17 a 23:17 (hora de España en verano); GitHub a veces se salta alguna
  workflow_dispatch:
    inputs:
      orden:
        description: "Qué hacer"
        type: choice
        default: todo
        options: [todo, actualizar, analizar, web, avisar, prueba_aviso, historico]
      meses:
        description: "Solo para 'historico': meses hacia atrás"
        default: "12"
      licitacion:
        description: "Solo para 'analizar': enlace o expediente de UNA licitación (vacío = las mejores pendientes)"
        default: ""

permissions:
  contents: write   # solo para el commit vacío de 'mantener activo'
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # La base de datos (cifrada) se guarda en la caché de Actions, no en el repositorio
      - name: Recuperar base de datos
        uses: actions/cache/restore@v4
        with:
          path: data/radar.db.enc
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Comprobar contraseña
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::Falta el secreto SITE_PASSWORD (sin él los datos serían públicos)."; exit 1
          fi

      - name: Ejecutar radar
        id: radar
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          CONFIG_PRIVADA: ${{ secrets.CONFIG_PRIVADA }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          LICITACION: ${{ github.event.inputs.licitacion }}
          RADAR_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          ORDEN="${{ github.event.inputs.orden || 'todo' }}"
          if [ "$ORDEN" = "historico" ]; then
            python run.py historico "${{ github.event.inputs.meses || '12' }}"
          else
            python run.py "$ORDEN"
          fi

      # Aunque algo falle, se guarda lo avanzado y se publica la web
      - name: Guardar base de datos (cifrada)
        if: always() && hashFiles('data/radar.db.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: data/radar.db.enc
          key: radar-db-${{ github.run_id }}

      - name: Preparar web
        if: always() && hashFiles('site/data.enc') != ''
        uses: actions/configure-pages@v5
      - name: Subir web
        if: always() && hashFiles('site/data.enc') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar web
        id: deploy
        if: always() && hashFiles('site/data.enc') != ''
        uses: actions/deploy-pages@v4

      # GitHub apaga los horarios si el repositorio pasa 60 días sin cambios: commit vacío cada 45 días
      - name: Mantener activo el radar
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantener activo el radar"
            git push
          else
            echo "Último cambio hace menos de 45 días: no hace falta."
          fi
