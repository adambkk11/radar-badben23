name: Prueba de conexión

on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Plataforma de Contratación (feed)
        run: |
          curl -sS -o feed.atom -w "HTTP %{http_code} · %{size_download} bytes · %{time_total}s\n" -A "RadarBadBen23/1.0" \
            https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom || true
          head -c 400 feed.atom || true
      - name: Plataformas agregadas (feed)
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} · %{size_download} bytes\n" -A "RadarBadBen23/1.0" \
            https://contrataciondelestado.es/sindicacion/sindicacion_1044/PlataformasAgregadasSinMenores.atom || true
      - name: Histórico mensual (ZIP)
        run: |
          M=$(date -u -d "$(date +%Y-%m-01) -1 month" +%Y%m)
          for U in https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_$M.zip \
                   https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_1044/PlataformasAgregadasSinMenores_$M.zip; do
            curl -sS -I -A "RadarBadBen23/1.0" "$U" | head -5 || true
          done
