name: Prueba completa

# Ejecuta el radar con datos reales SIN publicar nada (contraseña de prueba) y prueba la web en un navegador.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"   # cada lunes a las 6:41 (hora de España): si algo deja de funcionar, GitHub te avisa por correo

env:
  PYTHONUNBUFFERED: "1"
  SITE_PASSWORD: prueba-ci
  # Prueba corta: pocas páginas del feed y sin descargar meses del histórico
  CONFIG_PRIVADA: '{"feeds": {"max_paginas_por_feed": 4, "dias_atras_primera_vez": 2, "max_paginas_menores": 1}, "historico": {"meses_por_ejecucion": 0}, "ia": {"max_analisis_por_ejecucion": 3, "reanalizar_por_ejecucion": 0}}'

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Radar completo (novedades, IA si hay clave, web, avisos)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run.py todo
      - name: Pliegos (descarga y lectura de PDF)
        run: |
          python - <<'PY'
          import json, sqlite3, sys
          sys.path.insert(0, ".")
          from radar.docs import obtener_pliegos
          from radar.privado import abrir_db
          from pathlib import Path
          abrir_db(Path("data/radar.db"), "prueba-ci")
          c = sqlite3.connect("data/radar.db")
          filas = c.execute("select data from licitaciones where estado='PUB' order by puntuacion desc limit 3").fetchall()
          for (d,) in filas:
              it = json.loads(d)
              p = obtener_pliegos(it, max_docs=2)
              print(it["titulo"][:70], "->", [(x["tipo"], len(x["texto"])) for x in p])
          PY
      - name: Resumen de datos
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("data/radar.db")
          q = lambda s: c.execute(s).fetchall()
          print("licitaciones:", q("select estado, count(*) from licitaciones group by 1"))
          print("prioridad abiertas:", q("select prioridad, count(*) from licitaciones where estado='PUB' group by 1"))
          print("adjudicaciones:", q("select tipo, count(*) from adjudicaciones group by 1"))
          PY
          ls -la site site/hist | head -20
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Probar la web en un navegador
        run: |
          npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          (cd site && python -m http.server 8765 >/dev/null 2>&1 &) && sleep 2
          node tests/web_test.mjs
      - name: Capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: captura-*.png
          retention-days: 3
